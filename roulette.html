<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruleta · Pepazo</title>
  <link rel="stylesheet" href="roulette.css">
</head>
<body>
  <main class="roulette-stage" aria-label="Ruleta de pepazos">
    <div class="roulette-label">PEPAZO</div>
    <h1 id="roulette-team">RULETA</h1>
    <div class="roulette-box" id="roulette-box">
      <div id="roulette-icon" aria-hidden="true">🎰</div>
      <div id="roulette-name">ESPERANDO UN GIRO</div>
    </div>
    <p id="roulette-assignment" class="roulette-assignment" aria-live="polite" hidden></p>
    <p id="roulette-desc" aria-live="polite">Abre un pepazo desde el panel de tu equipo.</p>
    <button type="button" id="roulette-spin" class="roulette-spin" hidden>🎰 Girar</button>
  </main>
  <script src="roulette-core.js"></script>
  <script src="roulette-popup.js"></script>
</body>
</html>
